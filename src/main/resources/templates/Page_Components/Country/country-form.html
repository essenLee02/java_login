<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${mode} == 'edit' ? 'Edit Country' : 'New Country')}"></head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main">
        <main class="content">
            <div class="container-fluid p-0" style="max-width: 900px;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 th:text="${mode} == 'edit' ? 'Edit Country' : 'New Country'}"></h3>
                    <a class="btn btn-outline-secondary" th:href="@{/countries}">Back</a>
                </div>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="card">
                    <div class="card-body">
                        <form method="post" th:action="${mode} == 'edit' ? @{/countries/{id}(id=${country.id})} : @{/countries}" class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">ID Country</label>
                                <input type="text" class="form-control" th:value="${mode} == 'edit' ? country.idCountry : 'AUTO GENERATED'}" readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Code</label>
                                <input type="text" name="code" class="form-control" th:value="${country.code}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" th:value="${country.name}" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-select">
                                    <option value="1" th:selected="${country.status == 1}">Active</option>
                                    <option value="0" th:selected="${country.status == 0}">Inactive</option>
                                </select>
                            </div>

                            <div class="col-12 d-flex gap-2">
                                <button type="submit" class="btn btn-primary" th:text="${mode} == 'edit' ? 'Save Changes' : 'Create Country'}"></button>
                                <a class="btn btn-outline-secondary" th:href="@{/countries}">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts(~{::extraScripts})}">
    <th:block th:fragment="extraScripts"></th:block>
</div>
</body>
</html>
