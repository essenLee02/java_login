<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Business Unit Master')}"></head>

    <body>
        <div class="wrapper">
            <!-- Sidebar dari layout Start -->
            <div th:replace="~{fragments/layout :: sidebar}"></div>
            <!-- Sidebar dari layout End -->

            <div class="main">
                <!-- Navbar Header dari layout Start -->
                <div th:replace="~{fragments/layout :: sidebar_header}"></div>
                <!-- Navbar Header dari layout End -->

                <main class="content">
                    <div class="container-fluid p-0">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h3 class="mb-0">Business Unit Master</h3>
                                <div class="text-muted">Manage Business Unit data</div>
                            </div>
                            <a class="btn btn-primary" th:href="@{/business-units/new}">+ New Business Unit</a>
                        </div>

                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <div class="card">
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-sm table-striped align-middle">
                                        <thead class="table-light">
                                        <tr>
                                            <th>ID</th>
                                            <th>ID Business Unit</th>
                                            <th>ID Company</th>
                                            <th>Code</th>
                                            <th>Name</th>
                                            <th>Country</th>
                                            <th>Province</th>
                                            <th>City</th>
                                            <th>Email</th>
                                            <th>Phone</th>
                                            <th>Status</th>
                                            <th style="width:110px;">Action</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="bu : ${businessUnits}">
                                            <td th:text="${bu.id}"></td>
                                            <td th:text="${bu.idBussinessUnit}"></td>
                                            <td th:text="${bu.idCompany}"></td>
                                            <td th:text="${bu.code}"></td>
                                            <td th:text="${bu.name}"></td>
                                            <td th:text="${bu.idCountry}"></td>
                                            <td th:text="${bu.idProvince}"></td>
                                            <td th:text="${bu.idCity}"></td>
                                            <td th:text="${bu.email}"></td>
                                            <td th:text="${bu.phoneNumber}"></td>
                                            <td>
                                                <span class="badge bg-success" th:if="${bu.status == 1}">Active</span>
                                                <span class="badge bg-secondary" th:if="${bu.status != 1}">Inactive</span>
                                            </td>
                                            <td>
                                                <a class="btn btn-outline-secondary btn-sm"
                                                th:href="@{/business-units/{id}/edit(id=${bu.id})}">
                                                    Edit
                                                </a>
                                            </td>
                                        </tr>

                                        <tr th:if="${#lists.isEmpty(businessUnits)}">
                                            <td colspan="12" class="text-center text-muted py-4">No Business Unit data yet.</td>
                                        </tr>
                                        </tbody>
                                    </table>

                                    <nav aria-label="Business Unit pagination" class="mt-3" th:if="${totalPages != null and totalPages > 1}">
                                        <ul class="pagination justify-content-center mb-0">
                                            <li class="page-item" th:classappend="${!hasPrev} ? ' disabled'">
                                                <a class="page-link" th:href="@{/business-units(page=${currentPage-1})}">
                                                    &laquo;
                                                </a>
                                            </li>

                                            <li class="page-item"
                                                th:each="p : ${pageNumbers}"
                                                th:classappend="${p == currentPage} ? ' active'">
                                                <a class="page-link"
                                                th:href="@{/business-units(page=${p})}"
                                                th:text="${p + 1}">1</a>
                                            </li>

                                            <li class="page-item" th:classappend="${!hasNext} ? ' disabled'">
                                                <a class="page-link" th:href="@{/business-units(page=${currentPage+1})}">
                                                    &raquo;
                                                </a>
                                            </li>
                                        </ul>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Scripts Start -->
        <div th:replace="~{fragments/layout :: scripts(~{::extraScripts})}">
            <th:block th:fragment="extraScripts">
                <!-- contoh tambahan script (kalau file-nya memang ada) -->
                <script th:src="@{/Template/toast/toastr.min.js}"></script>
                <script th:src="@{/Function_Path/function_form.js}"></script>
                <script th:src="@{/Function_Path/function_work.js}"></script>
                <script>
                    $(function () {
                        $('#stock').on('input', function () {
                            let v = $(this).val();
                            v = v.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');

                            const parts = v.split('.');
                            if (parts.length > 2) {
                                v = parts.shift() + '.' + parts.join('');
                            }

                            if (v.startsWith('.')) {
                                v = '0' + v;
                            }

                            $(this).val(v);
                        });
                    });
                </script>
            </th:block>
        </div>
        <!-- Scripts End -->
    </body>
</html>
