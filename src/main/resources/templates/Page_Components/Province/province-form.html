<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head(mode == 'edit' ? 'Edit Province' : 'New Province')}"></head>
    <body>
        <div class="wrapper">
            <div th:replace="~{fragments/layout :: sidebar}"></div>

            <div class="main">
                <main class="content">
                    <div class="container-fluid p-0" style="max-width: 950px;">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 th:text="${mode == 'edit' ? 'Edit Province' : 'New Province'}">Province</h3>
                            <a class="btn btn-outline-secondary" th:href="@{/provinces}">Back</a>
                        </div>

                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                        <div class="card">
                            <div class="card-body">
                                <form method="post"
                                    th:action="${mode == 'edit'} ? @{/provinces/{id}(id=${province.id})} : @{/provinces}"
                                    class="row g-3">

                                    <div class="col-md-6">
                                        <label class="form-label">ID Province</label>
                                        <input type="text"
                                            class="form-control"
                                            th:value="${mode == 'edit' ? province.idProvince : 'AUTO GENERATED'}"
                                            readonly>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Country</label>
                                        <input type="hidden" name="idCountry" id="idCountry" th:value="${province.idCountry}">
                                        <div class="input-group">
                                            <input type="text"
                                                id="countryDisplay"
                                                class="form-control"
                                                th:value="${province.countryName}"
                                                placeholder="Choose Country..."
                                                readonly
                                                required>
                                            <button type="button" class="btn btn-outline-primary" id="btnOpenCountryModal">
                                                Search
                                            </button>
                                        </div>
                                        <div class="form-text">Pilih country melalui popup.</div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Code</label>
                                        <input type="text"
                                            name="code"
                                            class="form-control"
                                            th:value="${province.code}">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Name</label>
                                        <input type="text"
                                            name="name"
                                            class="form-control"
                                            th:value="${province.name}"
                                            required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Status</label>
                                        <select name="status" class="form-select">
                                            <option value="1" th:selected="${province.status == 1}">Active</option>
                                            <option value="0" th:selected="${province.status == 0}">Inactive</option>
                                        </select>
                                    </div>

                                    <div class="col-12 d-flex gap-2">
                                        <button type="submit"
                                                class="btn btn-primary"
                                                th:text="${mode == 'edit' ? 'Save Changes' : 'Create Province'}">
                                            Save
                                        </button>
                                        <a class="btn btn-outline-secondary" th:href="@{/provinces}">Cancel</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Modal Start -->
        <div class="modal fade" id="countryModal" tabindex="-1" aria-labelledby="countryModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-scrollable modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Select Country</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-2 mb-3">
                            <div class="col-md-8">
                                <input type="text" id="countrySearchKeyword" class="form-control" placeholder="Search code or name">
                            </div>
                            <div class="col-md-4">
                                <button type="button" class="btn btn-primary w-100" id="btnSearchCountry">Search</button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-sm table-striped align-middle">
                                <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Name</th>
                                    <th style="width: 120px;">Action</th>
                                </tr>
                                </thead>
                                <tbody id="countryModalTableBody">
                                <tr>
                                    <td colspan="3" class="text-center text-muted">No data</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <nav class="mt-3">
                            <ul class="pagination justify-content-center mb-0" id="countryModalPagination"></ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal End -->

        <!-- Scripts Start -->
        <div th:replace="~{fragments/layout :: scripts(~{::extraScripts})}">
            <th:block th:fragment="extraScripts">

                <script th:src="@{/Template/toast/toastr.min.js}"></script>
                <script th:src="@{/Function_Path/function_form.js}"></script>
                <script th:src="@{/Function_Path/function_work.js}"></script>

                <script>
                    $(document).ready(function () {

                        var countryModal = new bootstrap.Modal(document.getElementById('countryModal'), {
                            backdrop: 'static',
                            keyboard: true
                        });

                        // buka modal
                        $('#btnOpenCountryModal').on('click', function (e) {
                            e.preventDefault();
                            $('#countrySearchKeyword').val('');
                            loadCountry('', 0);
                            countryModal.show();
                        });

                        // search button
                        $('#btnSearchCountry').on('click', function (e) {
                            e.preventDefault();
                            loadCountry($('#countrySearchKeyword').val(), 0);
                        });

                        // enter key pada search
                        $('#countrySearchKeyword').on('keydown', function (e) {
                            if (e.key === 'Enter' || e.keyCode === 13) {
                                e.preventDefault();
                                loadCountry($('#countrySearchKeyword').val(), 0);
                            }
                        });

                        function loadCountry(keyword, page) {
                            var urlHit = '/api/provinces/countries/search';
                            var methodHit = 'GET';
                            var headerHit = {};
                            var dataHit = {
                                search: keyword,
                                page: page,
                                size: 5
                            };

                            ajaxHit(urlHit, methodHit, headerHit, dataHit, function (response) {
                                renderCountryRows(response.content);
                                renderCountryPagination(response, keyword);
                            }, function (xhr) {
                                console.log('Error:', xhr.responseText);
                                $('#countryModalTableBody').html(`
                                    <tr>
                                        <td colspan="3" class="text-center text-danger">Failed to load data</td>
                                    </tr>
                                `);
                                $('#countryModalPagination').empty();
                            });
                        }

                        function renderCountryRows(data) {
                            $('#countryModalTableBody').empty();

                            if (!data || data.length === 0) {
                                $('#countryModalTableBody').html(`
                                    <tr>
                                        <td colspan="3" class="text-center text-muted">No data</td>
                                    </tr>
                                `);
                                return;
                            }

                            let rows = '';
                            $.each(data, function (index, item) {
                                rows += `
                                    <tr>
                                        <td>${item.code != null ? item.code : ''}</td>
                                        <td>${item.name != null ? item.name : ''}</td>
                                        <td>
                                            <button type="button"
                                                    class="btn btn-sm btn-success btnChooseCountry"
                                                    data-id="${item.idCountry != null ? item.idCountry : ''}"
                                                    data-name="${item.name != null ? item.name : ''}">
                                                Choose
                                            </button>
                                        </td>
                                    </tr>
                                `;
                            });

                            $('#countryModalTableBody').html(rows);
                        }

                        $(document).on('click', '.btnChooseCountry', function (e) {
                            e.preventDefault();

                            var countryId = $(this).data('id');
                            var countryName = $(this).data('name');

                            $('#idCountry').val(countryId);
                            $('#countryDisplay').val(countryName);

                            countryModal.hide();
                        });

                        function renderCountryPagination(data, keyword) {
                            $('#countryModalPagination').empty();

                            if (!data || data.totalPages <= 1) {
                                return;
                            }

                            let pagination = '';

                            pagination += `
                                <li class="page-item ${data.hasPrev ? '' : 'disabled'}">
                                    <a class="page-link modal-page-link" href="#" data-page="${data.currentPage - 1}" data-keyword="${keyword}">&laquo;</a>
                                </li>
                            `;

                            for (let i = 0; i < data.totalPages; i++) {
                                pagination += `
                                    <li class="page-item ${i === data.currentPage ? 'active' : ''}">
                                        <a class="page-link modal-page-link" href="#" data-page="${i}" data-keyword="${keyword}">
                                            ${i + 1}
                                        </a>
                                    </li>
                                `;
                            }

                            pagination += `
                                <li class="page-item ${data.hasNext ? '' : 'disabled'}">
                                    <a class="page-link modal-page-link" href="#" data-page="${data.currentPage + 1}" data-keyword="${keyword}">&raquo;</a>
                                </li>
                            `;

                            $('#countryModalPagination').html(pagination);
                        }

                        $(document).on('click', '.modal-page-link', function (e) {
                            e.preventDefault();

                            if ($(this).parent().hasClass('disabled')) {
                                return;
                            }

                            var page = $(this).data('page');
                            var keyword = $(this).data('keyword');

                            loadCountry(keyword, page);
                        });

                    });
                </script>
            </th:block>
        </div>
        <!-- Scripts End -->
    </body>
</html>
