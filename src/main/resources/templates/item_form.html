<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${mode}=='edit' ? 'Edit Item' : 'New Item'">Item</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/dashboard" th:text="${session.userName}">
                    Auth Demo
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="nav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="/items">Item Master</a></li>
                    </ul>
                    <div class="d-flex">
                        <form action="/logout" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container py-4" style="max-width: 840px;">
            <h3 class="mb-3" th:text="${mode}=='edit' ? 'Edit Item' : 'New Item'">New Item</h3>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="${mode}=='edit' ? @{/items/{id}(id=${item.id})} : @{/items}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Code</label>
                    <input name="code" type="text" class="form-control" th:value="${item.code}" required maxlength="100">
                    <div class="form-text">Unique by <b>Code + Business Unit</b>.</div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Business Unit</label>
                    <select name="businessUnit" class="form-select" required>
                        <option value="" disabled th:selected="${item.businessUnit}==null">Select BU</option>
                        <option th:each="bu : ${businessUnits}" th:value="${bu}" th:text="${bu}" th:selected="${bu}==${item.businessUnit}"></option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label">Description</label>
                    <input name="description" type="text" class="form-control" th:value="${item.description}" required maxlength="255">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Item Type</label>
                    <select name="itemType" class="form-select" required>
                        <option value="" disabled th:selected="${item.itemType}==null">Select type</option>
                        <option th:each="t : ${itemTypes}" th:value="${t}" th:text="${t}" th:selected="${t}==${item.itemType}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Stock</label>
                    <input name="stock" type="number" step="0.0001" min="0" class="form-control" th:value="${item.stock}">
                </div>

                <div class="col-12">
                    <label class="form-label">Note</label>
                    <textarea name="note" class="form-control" rows="4" th:text="${item.note}"></textarea>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="${mode}=='edit' ? 'Save Changes' : 'Create Item'">Create</button>
                    <a class="btn btn-outline-secondary" href="/items">Cancel</a>
                </div>
            </form>

            <hr class="my-4">
            <div class="small text-muted" th:if="${mode}=='edit'">
                <div>Created: <span th:text="${item.createdAt}"></span> by <span th:text="${item.createdBy}"></span></div>
                <div>Updated: <span th:text="${item.updatedAt}"></span> by <span th:text="${item.updatedBy}"></span></div>
            </div>
        </div>

    </body>
</html>
