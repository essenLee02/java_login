<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Province Master')}"></head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main">
        <main class="content">
            <div class="container-fluid p-0">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h3 class="mb-0">Province Master</h3>
                        <div class="text-muted">Manage provinces</div>
                    </div>
                    <a class="btn btn-primary" th:href="@{/provinces/new}">+ New Province</a>
                </div>

                <form class="row g-2 mb-3" method="get" th:action="@{/provinces}">
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="search" th:value="${search}" placeholder="Search code, name, country">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-outline-secondary">Search</button>
                    </div>
                </form>

                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="card">
                    <div class="card-body table-responsive">
                        <table class="table table-striped table-sm align-middle">
                            <thead>
                            <tr>
                                <th>ID Province</th>
                                <th>Country</th>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="row : ${provinces}">
                                <td th:text="${row.idProvince}"></td>
                                <td th:text="${row.countryName}"></td>
                                <td th:text="${row.code}"></td>
                                <td th:text="${row.name}"></td>
                                <td th:text="${row.status == 1 ? 'Active' : 'Inactive'}"></td>
                                <td>
                                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/provinces/{id}/edit(id=${row.id})}">Edit</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(provinces)}">
                                <td colspan="6" class="text-center">No data</td>
                            </tr>
                            </tbody>
                        </table>

                        <nav class="mt-3" th:if="${totalPages > 1}">
                            <ul class="pagination justify-content-center mb-0">
                                <li class="page-item" th:classappend="${!hasPrev} ? 'disabled'">
                                    <a class="page-link" th:href="@{/provinces(page=${currentPage-1},size=${pageSize},search=${search})}">&laquo;</a>
                                </li>
                                <li class="page-item" th:each="p : ${pageNumbers}" th:classappend="${p == currentPage} ? 'active'">
                                    <a class="page-link" th:text="${p + 1}" th:href="@{/provinces(page=${p},size=${pageSize},search=${search})}"></a>
                                </li>
                                <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                                    <a class="page-link" th:href="@{/provinces(page=${currentPage+1},size=${pageSize},search=${search})}">&raquo;</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts(~{::extraScripts})}">
    <th:block th:fragment="extraScripts"></th:block>
</div>
</body>
</html>
