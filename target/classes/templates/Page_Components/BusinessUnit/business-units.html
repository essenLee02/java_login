<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Business Unit Master')}"></head>

    <body>
        <div class="wrapper">
            <!-- Sidebar dari layout Start -->
            <div th:replace="~{fragments/layout :: sidebar}"></div>
            <!-- Sidebar dari layout End -->

            <div class="main">
                <!-- Navbar Header dari layout Start -->
                <div th:replace="~{fragments/layout :: sidebar_header}"></div>
                <!-- Navbar Header dari layout End -->

                <main class="content">
                    <div class="container-fluid p-0">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h3 class="mb-0">Business Unit Master</h3>
                                <div class="text-muted">Manage Business Unit data</div>
                            </div>
                            <a class="btn btn-primary" th:href="@{/business-units/new}">+ New Business Unit</a>
                        </div>

                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <div class="card">
                            <div class="card-header">
                                <div class="input-group">
                                    <input type="text"
                                        class="form-control form-control-lg"
                                        placeholder="Search by code, name, country, province, city, email, phone..."
                                        id="search"
                                        name="search"
                                        value="">
                                    <button class="btn btn-info text-light" type="button" id="btnSearch">Search</button>
                                    <button class="btn btn-outline-secondary" type="button" id="btnResetSearch">Reset</button>
                                </div>
                            </div>

                            <div class="card-body">
                                <div id="printTable"></div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Scripts Start -->
        <div th:replace="~{fragments/layout :: scripts(~{::extraScripts})}">
            <th:block th:fragment="extraScripts">
                <script th:src="@{/Template/toast/toastr.min.js}"></script>
                <script th:src="@{/Function_Path/function_form.js}"></script>
                <script th:src="@{/Function_Path/function_work.js}"></script>

                <script th:inline="javascript">
                    $(document).ready(function () {
                        const businessUnitData = /*[[${businessUnits}]]*/ [];

                        bussinessMasterList($('#search').val(), 'show', 1);

                        function bussinessMasterList(bussinessName, type, page = 1) {
                            var headers = [
                                'BU Code',
                                'Name',
                                'Status'
                            ];

                            var chunks = [
                                'code',
                                'name',
                                'status'
                            ];

                            var keyword = (bussinessName || '').toString().trim().toLowerCase();

                            var filteredData = businessUnitData.filter(function (item) {
                                if (keyword === '') {
                                    return true;
                                }

                                var statusText = item.status == 1 ? 'active' : 'inactive';

                                return (
                                    (item.code || '').toString().toLowerCase().includes(keyword) ||
                                    (item.name || '').toString().toLowerCase().includes(keyword) ||
                                    (item.idBussinessUnit || '').toString().toLowerCase().includes(keyword) ||
                                    (item.idCompany || '').toString().toLowerCase().includes(keyword) ||
                                    (item.idCountry || '').toString().toLowerCase().includes(keyword) ||
                                    (item.idProvince || '').toString().toLowerCase().includes(keyword) ||
                                    (item.idCity || '').toString().toLowerCase().includes(keyword) ||
                                    (item.email || '').toString().toLowerCase().includes(keyword) ||
                                    (item.phoneNumber || '').toString().toLowerCase().includes(keyword) ||
                                    statusText.includes(keyword)
                                );
                            });

                            var actionUseable = true;
                            var actionType = [
                                'update',
                                'block',
                                'delete',
                            ];
                            var actionParameter = ['id_bussiness_unit'];

                            let cetakTable = tableModal(
                                headers,
                                chunks,
                                filteredData,
                                actionUseable,
                                actionType,
                                actionParameter,
                                null,
                                []
                            );

                            $('#printTable').empty();
                            $('#printTable').append(cetakTable);
                        }

                        $('#search').on('keyup', function() {
                            bussinessMasterList($('#search').val(), 'search', 1);
                        });

                        $('#btnSearch').on('click', function () {
                            bussinessMasterList($('#search').val(), 'search', 1);
                        });

                        $('#btnResetSearch').on('click', function () {
                            $('#search').val('');
                            bussinessMasterList('', 'reset', 1);
                        });
                    });
                </script>
            </th:block>
        </div>
        <!-- Scripts End -->
    </body>
</html>
