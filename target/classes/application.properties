server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/auth_demo?useSSL=false&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.thymeleaf.cache=false

# Auto-run schema.sql on startup (useful for local dev)
spring.sql.init.mode=always

# Aktifkan warna di Spring Boot console output
spring.output.ansi.enabled=ALWAYS

# Default page size for the Items list (/items)
app.pagination.page-size=8

app.location=Page_Components

app.open_status=O
app.closed_status=L
app.cancelation_status=C

